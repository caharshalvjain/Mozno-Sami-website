name: Build and Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main         # change to your default branch if not "main"
  workflow_dispatch:  # allows manual run from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'    # change if you need another version
          cache: 'npm'          # caches node modules between runs

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist        # Vite default output directory

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
